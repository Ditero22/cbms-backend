name: Daily staging recovery backup

on:
  workflow_dispatch:
  schedule:
    # 02:23 Asia/Singapore daily (18:23 UTC). Avoid the top of the hour, when GitHub may delay scheduled runs.
    - cron: '23 18 * * *'

permissions:
  contents: read

concurrency:
  group: cbms-staging-daily-backup
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging backup configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the main branch
        shell: bash
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          if [[ "$TARGET_REF" != "refs/heads/main" ]]; then
            echo "::error::Run staging backups from main only."
            exit 1
          fi

      - name: Check only whether required backup secrets exist
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
          STAGING_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
          STAGING_R2_BUCKET_NAME: ${{ secrets.STAGING_R2_BUCKET_NAME }}
          RECOVERY_R2_ACCOUNT_ID: ${{ secrets.RECOVERY_R2_ACCOUNT_ID }}
          RECOVERY_R2_ACCESS_KEY_ID: ${{ secrets.RECOVERY_R2_ACCESS_KEY_ID }}
          RECOVERY_R2_SECRET_ACCESS_KEY: ${{ secrets.RECOVERY_R2_SECRET_ACCESS_KEY }}
          RECOVERY_R2_BUCKET_NAME: ${{ secrets.RECOVERY_R2_BUCKET_NAME }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
        run: |
          missing=0
          for name in STAGING_DATABASE_URL STAGING_R2_ACCOUNT_ID STAGING_R2_ACCESS_KEY_ID STAGING_R2_SECRET_ACCESS_KEY STAGING_R2_BUCKET_NAME RECOVERY_R2_ACCOUNT_ID RECOVERY_R2_ACCESS_KEY_ID RECOVERY_R2_SECRET_ACCESS_KEY RECOVERY_R2_BUCKET_NAME BACKUP_ENCRYPTION_KEY BACKUP_RETENTION_DAYS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret is missing: $name"
              missing=1
            fi
          done
          exit "$missing"

  backup:
    name: Back up staging database and proof objects
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
      STAGING_R2_BUCKET_NAME: ${{ secrets.STAGING_R2_BUCKET_NAME }}
      RECOVERY_R2_ACCOUNT_ID: ${{ secrets.RECOVERY_R2_ACCOUNT_ID }}
      RECOVERY_R2_ACCESS_KEY_ID: ${{ secrets.RECOVERY_R2_ACCESS_KEY_ID }}
      RECOVERY_R2_SECRET_ACCESS_KEY: ${{ secrets.RECOVERY_R2_SECRET_ACCESS_KEY }}
      RECOVERY_R2_BUCKET_NAME: ${{ secrets.RECOVERY_R2_BUCKET_NAME }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --include=dev

      - uses: ./.github/actions/setup-pg-client-18

      - name: Create and verify the daily staging backup
        run: node scripts/backup-staging-recovery.mjs
