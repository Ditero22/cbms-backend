name: Staging to isolated recovery rehearsal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter exactly RESTORE-TO-ISOLATED-cbms-recovery after checking all configured targets
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cbms-staging-recovery-rehearsal
  cancel-in-progress: false

jobs:
  validate:
    name: Validate isolated recovery request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and exact recovery confirmation
        shell: bash
        env:
          TARGET_REF: ${{ github.ref }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$TARGET_REF" != "refs/heads/main" ]]; then
            echo "::error::Run the recovery rehearsal from main only."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "RESTORE-TO-ISOLATED-cbms-recovery" ]]; then
            echo "::error::The exact isolated recovery confirmation is required."
            exit 1
          fi

      - name: Check only whether required recovery secrets exist
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          RECOVERY_DATABASE_URL: ${{ secrets.RECOVERY_DATABASE_URL }}
          STAGING_R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
          STAGING_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
          STAGING_R2_BUCKET_NAME: ${{ secrets.STAGING_R2_BUCKET_NAME }}
          RECOVERY_R2_ACCOUNT_ID: ${{ secrets.RECOVERY_R2_ACCOUNT_ID }}
          RECOVERY_R2_ACCESS_KEY_ID: ${{ secrets.RECOVERY_R2_ACCESS_KEY_ID }}
          RECOVERY_R2_SECRET_ACCESS_KEY: ${{ secrets.RECOVERY_R2_SECRET_ACCESS_KEY }}
          RECOVERY_R2_BUCKET_NAME: ${{ secrets.RECOVERY_R2_BUCKET_NAME }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
        run: |
          missing=0
          for name in STAGING_DATABASE_URL RECOVERY_DATABASE_URL STAGING_R2_ACCOUNT_ID STAGING_R2_ACCESS_KEY_ID STAGING_R2_SECRET_ACCESS_KEY STAGING_R2_BUCKET_NAME RECOVERY_R2_ACCOUNT_ID RECOVERY_R2_ACCESS_KEY_ID RECOVERY_R2_SECRET_ACCESS_KEY RECOVERY_R2_BUCKET_NAME BACKUP_ENCRYPTION_KEY BACKUP_RETENTION_DAYS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret is missing: $name"
              missing=1
            fi
          done
          exit "$missing"

  rehearse:
    name: Backup staging and restore to isolated recovery targets
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      RECOVERY_DATABASE_URL: ${{ secrets.RECOVERY_DATABASE_URL }}
      STAGING_R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
      STAGING_R2_BUCKET_NAME: ${{ secrets.STAGING_R2_BUCKET_NAME }}
      RECOVERY_R2_ACCOUNT_ID: ${{ secrets.RECOVERY_R2_ACCOUNT_ID }}
      RECOVERY_R2_ACCESS_KEY_ID: ${{ secrets.RECOVERY_R2_ACCESS_KEY_ID }}
      RECOVERY_R2_SECRET_ACCESS_KEY: ${{ secrets.RECOVERY_R2_SECRET_ACCESS_KEY }}
      RECOVERY_R2_BUCKET_NAME: ${{ secrets.RECOVERY_R2_BUCKET_NAME }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and PostgreSQL client tools
        run: |
          npm ci --include=dev
          sudo apt-get install --yes ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 18\.'

      - name: Back up staging and restore into the empty recovery database
        run: node scripts/rehearse-staging-recovery.mjs
